packages:
  - packages/*
  - design-systems/*
  - apps/*
  - templates/*
  - plugin

# One version of each shared tool, referenced as "catalog:" by the packages.
catalog:
  '@figma/plugin-typings': 1.139.0
  '@types/node': 22.20.4
  esbuild: 0.28.2
  oxc-parser: 0.151.0
  oxlint: 1.86.0
  sharp: 0.35.5
  tsx: 4.23.15
  typescript: 7.0.2

# esbuild's install script only checks its platform binary.
allowBuilds:
  esbuild: true

# The pinned Octicons release is younger than pnpm's minimum release age.
minimumReleaseAgeExclude:
  - '@primer/octicons@19.37.0'
